packages:
  - "frontend"
  - "harness"

allowBuilds:
  esbuild: true
  "@scarf/scarf": false
  unrs-resolver: false

# Force patched versions of vulnerable dev/transitive deps flagged by the audit check.
# All are pulled in by tooling (lhci, ajv-cli, telemetry), not shipped to consumers.
overrides:
  tmp: ">=0.2.6"
  uuid: ">=11.1.1"
  fast-json-patch: ">=3.1.1"
  fast-uri: ">=4.1.3"
  "@opentelemetry/core": ">=2.8.0"
  # 8.65.0 was unpublished from npm (latest is 8.64.0); pin the whole set so the
  # stale lock entry re-resolves instead of blocking every install.
  "@typescript-eslint/types": "8.64.0"
  "@typescript-eslint/utils": "8.64.0"
  typescript-eslint: "8.64.0"
  # harness/package.json asks for "latest", and 74.0.0 added
  # `consistent-arrow-return-style`, which fails 35 pre-existing call sites and
  # (once auto-fixed) pushes harness/logging.ts past its own max-lines cap.
  # Pinned to the version main last went green on; adopting 74 is its own change.
  eslint-plugin-unicorn: "72.0.0"
  # Patched transitive dev deps flagged by newer audit-DB advisories. brace-expansion
  # is scoped per major so each already-safe line is left alone; the rest are tooling
  # deps (lhci, ajv, socks/proxy agents, postcss) never shipped to the site.
  brace-expansion: ">=5.0.9"
  ip-address: ">=10.3.1"
  postcss: ">=8.5.23"
  undici: ">=7.29.0"
  # Advisories that landed after the last green `ci` run on main (2026-08-05).
  baseline-browser-mapping: ">=2.11.0"
  browserslist: ">=4.28.7"
  colord: ">=2.9.4"
  "nanoid@3": ">=3.3.18"
  qs: ">=6.16.0"
  # The rest are pinned exactly rather than ">=", because an open range here
  # walks the dependency onto a new major instead of the patched same-major
  # release, which is how each of these actually broke:
  #   js-yaml    - ">=3.15.2" pulled @lhci/utils's ^3.13.1 up to 4.3.0, which is
  #                itself vulnerable and drops js-yaml 3's safeLoad API.
  #   vitest     - ">=4.1.11" resolved to 5.0.0, whose v8 provider attributes
  #                vite.config.ts's build-time plugin hooks differently and puts
  #                the repo under its own 100% coverage threshold.
  # The @vitest/* entries must track vitest exactly; a mismatched coverage-v8
  # reports 0% instead of erroring.
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  vitest: "4.1.11"
  "@vitest/mocker": "4.1.11"
  "@vitest/coverage-v8": "4.1.11"

  # Puppeteer 25 removes the vulnerable extract-zip dependency.
  puppeteer-core: "25.3.0"
